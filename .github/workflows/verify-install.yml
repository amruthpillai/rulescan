name: Verify public installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected published version selected by the latest installer
        required: true
        default: "0.1.1"
        type: string

permissions:
  contents: read

jobs:
  install:
    name: Public install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Install without authentication on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export RULESCAN_INSTALL_DIR="$RUNNER_TEMP/rulescan-public-install"
          curl -fsSL https://github.com/amruthpillai/rulescan/releases/latest/download/install.sh | sh
          test "$("$RULESCAN_INSTALL_DIR/rulescan" --version)" = "rulescan $EXPECTED_VERSION"
          test -s "$RULESCAN_INSTALL_DIR/rulescan-notices.txt"
      - name: Install without authentication with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RULESCAN_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'rulescan-public-install'
          irm https://github.com/amruthpillai/rulescan/releases/latest/download/install.ps1 | iex
          $binary = Join-Path $env:RULESCAN_INSTALL_DIR 'rulescan.exe'
          $version = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne ('rulescan ' + $env:EXPECTED_VERSION)) { throw 'Installed version mismatch.' }
          if (-not (Test-Path (Join-Path $env:RULESCAN_INSTALL_DIR 'rulescan-notices.txt') -PathType Leaf)) { throw 'Notices were not installed.' }
